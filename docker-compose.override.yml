# Development overrides. Applied automatically by `docker compose up`.
# Hot reload for backend and frontend; Postgres exposed on 5433 for local tools.
services:
  db:
    ports:
      - "5433:5432"

  backend:
    build:
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_prisma_client:/app/src/generated

  frontend:
    build:
      target: dev
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "${FRONT_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
  backend_prisma_client:
