version: "3.9"

services:

  frontend:
    container_name: training_frontend_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    container_name: training_backend_prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.production
    command: ["sh", "/app/entrypoint.sh"]
    depends_on:
      - db
    # Backend does NOT need to expose any port in production
    # Nginx will communicate with it internally in the Docker network

  db:
    container_name: training_db_prod
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: training_db
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # DB should NOT be exposed to the host in production
    # Only backend should access it, internally

volumes:
  pgdata_prod:
