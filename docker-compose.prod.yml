# Production-style overrides.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# nginx serves the built frontend and proxies /api to the backend; neither the
# database nor the backend is published to the host.
services:
  db:
    restart: unless-stopped

  backend:
    build:
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped

  frontend:
    build:
      target: runtime
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    restart: unless-stopped
